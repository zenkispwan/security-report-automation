name: Legacy Security Report (Gemini)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-send-report:
    name: Legacy report generator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install legacy dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai markdown

      - name: Generate legacy report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_report_gemini.py

      - name: Verify report
        run: test -f reports/security_report_latest.md

      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/security_report_latest.md
          if git diff --staged --quiet; then
            echo "No report changes."
          else
            git commit -m "legacy: update security report"
            git push
          fi

      - name: Send email
        if: success()
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          if [ -n "$EMAIL_SENDER" ] && [ -n "$EMAIL_PASSWORD" ]; then
            python scripts/send_email_gemini.py
          else
            echo "Email settings not configured; skip."
          fi
