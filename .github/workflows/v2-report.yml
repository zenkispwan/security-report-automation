name: V2 Grounded Security Intelligence Report

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - V2 Security Intelligence Collector
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'src/security_intel/reporting.py'
      - 'src/security_intel/llm/**'
      - 'scripts/generate_report_v2.py'
      - 'scripts/validate_report.py'
      - 'scripts/build_web_report.py'
      - 'scripts/validate_web_report.py'
      - 'web/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'requirements-report.txt'
      - '.github/workflows/v2-report.yml'
  pull_request:
    paths:
      - 'src/security_intel/reporting.py'
      - 'src/security_intel/llm/**'
      - 'scripts/generate_report_v2.py'
      - 'scripts/validate_report.py'
      - 'scripts/build_web_report.py'
      - 'scripts/validate_web_report.py'
      - 'web/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tests/test_reporting.py'
      - 'tests/test_gemini.py'
      - 'tests/test_web_report.py'
      - 'requirements-report.txt'
      - '.github/workflows/v2-report.yml'

permissions:
  contents: write

concurrency:
  group: security-intelligence-report-v2-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

jobs:
  test:
    name: Report unit tests
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-report.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-report.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic report smoke test
        env:
          GEMINI_SEARCH_MODE: off
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODELS: gemini-3.7-flash,gemini-3.6-flash
          REPORT_PROVIDER: gemini
        run: |
          python scripts/generate_report_v2.py
          python scripts/validate_report.py
      - name: Static web report smoke test
        run: |
          python scripts/build_web_report.py
          python scripts/validate_web_report.py
      - name: Cloudflare Workers Static Assets dry run
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run

  report:
    name: Generate security intelligence report
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main intelligence
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-report.txt

      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-report.txt

      - name: Generate security intelligence report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.7-flash,gemini-3.6-flash' }}
          GEMINI_SEARCH_MODE: ${{ vars.GEMINI_SEARCH_MODE || 'auto' }}
          GEMINI_SEARCH_TIMEOUT_MS: ${{ vars.GEMINI_SEARCH_TIMEOUT_MS || '45000' }}
          REPORT_PROVIDER: gemini
        run: python scripts/generate_report_v2.py

      - name: Validate report
        run: python scripts/validate_report.py

      - name: Preserve report artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-intelligence-report-${{ github.run_id }}
          path: |
            reports/security_report_latest.md
            reports/security_report_metadata.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/security_report_latest.md reports/security_report_metadata.json

          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi

          git commit -m "report: refresh grounded security intelligence brief"

          # Collector may publish refreshed data while this report is finishing.
          # Rebase the report-only commit onto newest main rather than racing with
          # or overwriting a concurrent data commit.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "ERROR: report commit conflicts with current main; refusing to overwrite remote state."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "ERROR: failed to push report after 3 race-safe attempts."
          exit 1
