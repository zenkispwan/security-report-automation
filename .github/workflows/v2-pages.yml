name: V2 Security Intelligence Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'reports/security_report_metadata.json'
      - 'web/**'
      - 'scripts/build_web_report.py'
      - 'scripts/validate_web_report.py'
      - '.github/workflows/v2-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: security-intelligence-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6

      - name: Build static web report
        run: python3 scripts/build_web_report.py

      - name: Validate static web report
        run: python3 scripts/validate_web_report.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
