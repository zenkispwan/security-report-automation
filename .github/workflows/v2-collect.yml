name: V2 Security Intelligence Collector

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: NVD / KEV lookback window
        required: false
        default: '48'
  schedule:
    - cron: '0 1 * * *'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/collect_v2.py'
      - 'scripts/validate_latest.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/v2-collect.yml'

permissions:
  contents: write

concurrency:
  group: security-intelligence-v2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect facts
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          LOOKBACK="${{ github.event.inputs.lookback_hours || '48' }}"
          python scripts/collect_v2.py --lookback-hours "$LOOKBACK"

      - name: Validate
        run: python scripts/validate_latest.py

      - name: Preserve raw snapshots
        uses: actions/upload-artifact@v4
        with:
          name: security-intel-raw-${{ github.run_id }}
          path: data/raw/latest/
          retention-days: 7
          if-no-files-found: error

      - name: Commit normalized facts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No normalized data changes."
          else
            git commit -m "data: refresh security intelligence"
            git push
          fi
