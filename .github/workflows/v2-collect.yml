name: V2 Security Intelligence Collector

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: NVD / KEV lookback window
        required: false
        default: '48'
  schedule:
    - cron: '0 1 * * *'
  push:
    branches:
      - main
    paths:
      - 'src/security_intel/__init__.py'
      - 'src/security_intel/http.py'
      - 'src/security_intel/normalize.py'
      - 'src/security_intel/pipeline.py'
      - 'src/security_intel/intelligence.py'
      - 'src/security_intel/events.py'
      - 'src/security_intel/collectors/**'
      - 'scripts/collect_v2.py'
      - 'scripts/validate_latest.py'
      - 'scripts/build_intelligence.py'
      - 'scripts/validate_intelligence.py'
      - 'scripts/collect_events.py'
      - 'scripts/validate_events.py'
      - 'config/event_profile.json'
      - 'tests/test_normalize.py'
      - 'tests/test_intelligence.py'
      - 'tests/test_events.py'
      - 'requirements.txt'
      - 'data/.gitignore'
      - '.github/workflows/v2-collect.yml'
  pull_request:
    paths:
      - 'src/security_intel/__init__.py'
      - 'src/security_intel/http.py'
      - 'src/security_intel/normalize.py'
      - 'src/security_intel/pipeline.py'
      - 'src/security_intel/intelligence.py'
      - 'src/security_intel/events.py'
      - 'src/security_intel/collectors/**'
      - 'scripts/collect_v2.py'
      - 'scripts/validate_latest.py'
      - 'scripts/build_intelligence.py'
      - 'scripts/validate_intelligence.py'
      - 'scripts/collect_events.py'
      - 'scripts/validate_events.py'
      - 'config/event_profile.json'
      - 'tests/test_normalize.py'
      - 'tests/test_intelligence.py'
      - 'tests/test_events.py'
      - 'requirements.txt'
      - 'data/.gitignore'
      - '.github/workflows/v2-collect.yml'

permissions:
  contents: write

concurrency:
  group: security-intelligence-v2-${{ github.head_ref || github.ref_name || github.event_name }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Preserve previous snapshot for bootstrap
        run: |
          if [ -f "data/latest.json" ]; then
            cp data/latest.json /tmp/previous_latest.json
            echo "Previous full snapshot preserved for delta bootstrap."
          else
            echo "No tracked full snapshot found; state.json will be used when available."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collector unit tests
        run: |
          python -m unittest discover -s tests -p 'test_normalize.py' -v
          python -m unittest discover -s tests -p 'test_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_events.py' -v

      - name: Collect vulnerability facts
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          LOOKBACK="${{ github.event.inputs.lookback_hours || '48' }}"
          python scripts/collect_v2.py --lookback-hours "$LOOKBACK"

      - name: Validate normalized vulnerability facts
        run: python scripts/validate_latest.py

      - name: Build vulnerability Daily Delta and Intelligence
        run: |
          python scripts/build_intelligence.py \
            --previous-snapshot /tmp/previous_latest.json

      - name: Validate compact vulnerability intelligence
        run: python scripts/validate_intelligence.py

      - name: Collect 24h security events
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/collect_events.py --lookback-hours 24

      - name: Validate security events
        run: python scripts/validate_events.py

      - name: Preserve full snapshots and intelligence outputs
        uses: actions/upload-artifact@v4
        with:
          name: security-intel-full-${{ github.run_id }}
          path: |
            data/latest.json
            data/state.json
            data/delta.json
            data/intelligence.json
            data/event_state.json
            data/events.json
            data/event_delta.json
            data/raw/latest/
            data/raw/events/latest/
          retention-days: 7
          if-no-files-found: error

      - name: Commit compact intelligence state
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/state.json data/delta.json data/intelligence.json \
            data/event_state.json data/events.json data/event_delta.json

          # The first V2.1 main run retires the large tracked snapshot.
          # The newly generated file remains in the workspace/artifact, but future runs do not commit it.
          if git ls-files --error-unmatch data/latest.json >/dev/null 2>&1; then
            git rm --cached data/latest.json
          fi

          if git diff --cached --quiet; then
            echo "No compact intelligence changes."
            exit 0
          fi

          git commit -m "data: refresh security intelligence delta"

          # Report and Collector can finish close together and both write to main.
          # Rebase this data-only commit onto the newest main and retry a bounded
          # number of times if another disjoint bot commit lands between fetch/push.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "ERROR: data commit conflicts with current main; refusing to overwrite remote state."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "ERROR: failed to push compact intelligence after 3 race-safe attempts."
          exit 1
